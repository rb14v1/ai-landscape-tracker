# Agentic AI Landscape Tracker - Crawler Configuration

# Data output settings
output:
  path: "../data/entries.json"
  
# Backfill settings
backfill:
  enabled: true
  start_date: "2024-01-01"

# Crawler behavior settings
crawler:
  delay_between_requests: 1  # Seconds to wait between requests
  max_retries: 3  # Maximum retry attempts for failed requests
  # Request timeout is read from the CRAWLER_TIMEOUT_SECONDS env var

# Source configurations
# Endpoint URLs are read from environment variables at runtime:
# url_setting / rss_url_setting name the Settings field (env var) holding the URL.
sources:
  - name: "Anthropic"
    type: "blog"
    url_setting: "source_anthropic_url"
    rss_url: null
    # Fixed: Accept-Encoding header removed to allow proper decompression
    enabled: true
    selectors:
      article_list: "a[href^='/news/']"
      title: "h4, h3, span.PublicationList-module-scss-module__KxYrHG__title"
      date: "time"
      link: null
      
  - name: "Cursor"
    type: "changelog"
    url_setting: "source_cursor_url"
    rss_url: null
    selectors:
      article_list: "article"  # Standard article tags
      title: "h1"  # Main heading
      date: "time"  # time element with datetime attribute
      link: "h1 a"  # Link is inside the h1
      
  - name: "GitHub Copilot"
    type: "blog"
    url_setting: "source_github_copilot_url"
    rss_url_setting: "source_github_copilot_rss_url"
    selectors:
      article_list: "article"
      title: "h2"
      date: "time"
      link: "a"
      
  - name: "OpenAI"
    type: "blog"
    url_setting: "source_openai_url"
    # Note: OpenAI blog has strong bot protection (403 errors)
    # Consider using their RSS feed or API if available
    rss_url_setting: "source_openai_rss_url"  # Alternative: Try main blog RSS
    selectors:
      article_list: "article"
      title: "h2, h3"
      date: "time"
      link: "a"

  - name: "Google DeepMind"
    type: "blog"
    url_setting: "source_google_deepmind_url"
    rss_url: null
    selectors:
      article_list: "article"
      title: "h3"
      date: "time"
      link: "a"

# Categories for classification
categories:
  - "Release"
  - "Feature"
  - "Research"
  - "API"
  - "Model"
  - "Tool"
  - "Other"
